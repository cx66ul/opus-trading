  D14:
    topic: 止损档位（用户 2026-10-09 08:25拍定）
    choice: 固定 5% 止损，**不做自动寻优**
    detail: >
      ★ 用户明确选5% 作为止损位，并要求做样本外验证。
      已落地：`backend/domain/backtest.py:stop_loss_pct` +
      `scripts/run_oos.py`。

      ★★ 样本外验证的关键发现（必须记住）：
        结果随**样本量震荡**，没有稳定优势：
          30 只→ 样本外 +1.00%（通过）
          60 只  → +0.51%（通过）
          100 只 → -0.19%（不过）
          150 只 →  0.00%（不过）
          200 只 → -0.15%（不过）
          300 只 → +0.24%（通过）
          400 只 → +0.44%（通过）
        收益在 0 附近来回穿越 ⇒ **单点「通过」是小样本巧合**。
        已在 `run_oos.py` 里加 `stability_check()` 作为一等能力，
        符号不一致即判`unstable`（不显著），并明确告知不要据此上线。

      ★★ 为什么样本外验证不能用 `backtest.walk_forward`：
        它把 bars 切片后**独立重跑**，隐含假设「entry_fn 只依赖片段内数据」。
        但缠论依赖 ① 长历史 ② **连续的 `seen` 集合**——
        实测 train=120/test=30 切片重跑后，成交从 2 笔掉到 **0 笔**
        （片段只30 根，而 warmup 就要 60 根）。
        ⇒ 会得到「样本外 0 笔 ⇒ 无法验证」的假结论。
        正确口径：**全样本连续跑，只按入场日统计样本外区间的成交**。

      结论：5% 止损**已锁定**（用户拍定），但当前入场/出场逻辑
      尚无可验证的稳定优势。下一步应改入场/出场（卖点出场胜率 87.5%，
      说明信号有效但太少），而不是继续调止损百分比。
    blocks: M9/M10
    status: 已定（用户拍定 5%；样本外验证未通过稳定性门槛）

  D15:
    topic: 卖点覆盖率 + 大盘基准（2026-10-09 用户「接着提高」后自主推进）
    choice: 加结构化离场（中枢破位），并**强制回测必须带大盘基准**
    detail: >
      用户要求「提高卖点覆盖率」。先量化根因，再选方案：

      ★ 根因（实测 25 只 × 4750 根 bar）：
        缠论卖点累计出现 5553 次，但**本日新可见仅 122 次（2.2%）**
        而「收盘跌破最近中枢下沿」占 **46.4%** 的天数
        ⇒ 缠论卖点天然稀疏（结构确认需要时间），
          靠放宽 level（纳入 normal 档）提升有限。
        所以加了**结构化离场**（`exit_mode`）：
          chan / chan_all / zs（跌破中枢下沿）/ zs_ma（+均线破位）/ none（对照）

      ★ 离场模式对比（60 只，止损 5%）：
        仅缠论卖点 strong：126 笔 胜率26.2% 平均-0.34% 持有 7.9d 净额-37,695
        缠论含 normal     ：126 笔 胜率25.4% 平均-0.32% 持有 7.9d 净额-27,911
        +中枢破位         ：129 笔 胜率17.1% 平均-0.12% 持有 4.9d 净额-17,452
        无离场(对照)      ：126 笔 胜率24.6% 平均-0.19% 持有 8.1d 净额-13,363
        ⇒ 覆盖率确实提高（7.9d→4.9d），但**胜率从 26.2% 掉到 17.1%**，
          且**连「无离场」对照组也是亏的** ⇒ 瓶颈不在离场。

      ★★★ 真正的关键发现（修正了 D14 的归因）：
        买点后 10 天 —— 个股平均 **-2.11%**、同期大盘 **-2.30%**
        **超额收益仅 +0.18%**
        按结构位置分组，超额也都在 ±0.3% 以内。
        ⇒ **买点信号在这段行情里没有 alpha**，只是跟随大盘涨跌。
        之前「策略亏了」的观感来自大盘本身在跌，不是信号失效也不是策略有效。

      ★ 落地：新增 `backend/domain.backtest.Benchmark`，
        `BacktestResult.stats()` 强制输出 `excess`；
        **无基准时显式警告**「未提供大盘基准」，不能让人误读为「超额为 0」。
        守护：test_stats_warns_when_no_benchmark /
              test_negative_strategy_can_have_positive_excess。
    blocks: M9/M10
    status: 已实现（结论：提高覆盖率有用但不是瓶颈；瓶颈是买点无 alpha）

