           `down` 段 2026-07-17~08-13 的**段内实际是 +8.02%**
           （下跌趋势的后期反弹），却因段末 60 日为 -11.91% 被标成「下跌市」
           ⇒ 统计把反弹期归进下跌市，得出「下跌市平均 +1.04%」的矛盾结论。
        3. 加 `min_len=10` 合并过短段。
      ★★ 修正后的结果（400 只 / 765 笔，止损 5%，离场 chan）：
        行情      笔数   胜率   平均收益  大盘基准  超额收益  超额胜率
        上涨市    460  26.5%   +0.06%   -1.55%  +1.61%（正）  42.2%
        震荡市    143  37.8%   +0.77%   +2.05%  -1.28%（负）  26.6%
        下跌市    162  38.3%   +0.72%   +0.13%  +0.59%（正）  43.2%
        全样本    765  31.1%   +0.34%   -0.52%   +0.85%    39.5%
      ★ 结论（**推翻了 D15 的「买点没有 alpha」**）：
        **上涨市超额 +1.61%，是三段里最高的** ⇒ 买点信号**确实有效**，
        之前的「无 alpha」是因为把上涨/震荡/下跌混在一起统计，
        互相抵消掉了。
        - 上涨市（大盘跌 1.55% 时，策略仍 +0.06%）⇒ 抗跌 + 有超额
        - 震荡市超额 **-1.28%** ⇒ ★ 震荡市是**最差的环境**（追高被套）
        - 下跌市超额 +0.59% ⇒ 反而比震荡市好（因止损生效快）
      ★★ 落地建议：缠论买点**不适合震荡市**（超额 -1.28%），
        应在 M5 六态状态机判定为「启动/发酵/修复」时才启用，
        「震荡/退潮」时不出买点。**这正是 D13「系统不自动交易、
        只给参考」定位的用武之地** —— 由人根据市场状态决定要不要动手。
      落地文件：`scripts/run_regime_split.py` + `tests/test_regime_split.py`(18 条)
    blocks: M9/M10
    status: 已验证（结论：买点有alpha，但震荡市无效，需择时）

  D17:
    topic: 市场状态门控（把 D16 落地为可执行规则）+ **修正 D14 的 unstable 判定**
    choice: 门控只用 point-in-time 因果信息；门控收益仅 +0.14pp，不建议上线
    detail: >
      新增 `backend/domain/regime_gate.py`：按等权指数 60日滚动的
      **截至当日**平均判状态（up/flat/down），支持门控与覆盖率统计。
      配套 `scripts/run_regime_gate.py`（含同口径前视对照 + 稳定性检验）
      与 `tests/test_regime_gate.py`（30 条）。

      ★★ 核心约束：**门控不能���用段标签**。
        `run_regime_split.market_segments` 的段定性来自**整段的 60 日涨跌平均**，
        含未来最多 64 天。实测段标签 up 与因果 up 的
        **Jaccard 仅 84.9%**（仅段标签 15 天、仅因果 11 天、交集 146 天）
        ⇒ 直接拿段标签做门控 = 事后知道这段是涨市才买入。

      ★★★ 修正 D14 的「结果随样本量震荡、无稳定优势」结论：
        D14 测的是**绝对收益**，它在 -0.19% ~ +1.00% 之间来回穿越零线，
        判 unstable 没错。但**扣掉大盘后的超额收益 7/7 档全为正**：

          标的数  绝对收益  超额收益
            30    +1.00%   +2.53%
            60    +0.51%   +2.35%
           100    -0.19%   +1.23%
           150     0.00%   +1.33%
           200    -0.15%   +1.15%
           300    +0.24%   +1.35%
           400    +0.44%   +1.42%

        同期大盘整体在跌，绝对收益被大盘拖动而天然不稳；
        超额（+1.15% ~ +2.53%，方向明确）才是策略自身的 edge。
        **这是 D15 引入大盘基准的价值：它把 D14 判死的策略救回来了。**

      ★ 门控的实际收益很小，不建议上线：
        up 门控 vs 基线（400 只，样本外）：
          超额   +1.56% vs +1.42%   仅 **+0.14pp**
          平均   -0.81% vs +0.44%   **反而更差**
          胜率18.8% vs 32.0%   **腰斩**
        样本量稳定性（up 门控超额）：30/60/100/150/200/300 只
          → +2.88/+2.77/+1.52/+1.76/+1.46/+1.45%  **6/6 通过**
        ⇒ 门控本身是稳定的，但**增益只有 0.1~0.4pp**，
          且各档差异远小于 D14 之前的震荡幅度 ⇒ 不足以支撑上线决策。
        `no_flat`（只避开震荡市）更稳：超额 +1.47%、胜率 32.4%（不低于基线）。

      ★★ 前视偏差的代价（同口径对照，锁定同一批日期）：
        因果(可用) +1.56% vs 段标签(含未来) +1.80% ⇒ 差 -0.24pp。
        第一版我直接拿两个门控比超额，得出「前视**反而更好**」的荒谬结论 ——
        因为两者选的**不是同一批日子**（Jaccard 84.9%），
        差值混了门控口径差异。已改为锁定 `up_dates` 再只改判定依据。

      ★ 途中修掉两个自身缺陷：
        1. `RegimeSeries.__post_init__` 对空 roll 抛 ValueError，
           而 `build_regime_series` 在数据不足一个窗口时**故意**返回空
           ⇒ 「数据不足」变成崩溃。已放行空 roll（判unknown，不是猜趋势）。
        2. `stats_of` 只算绝对收益不含超额，而 D15/D16 的结论**全部**
           建立在超额之上 ⇒ 新增 `stats_with_benchmark`。
    blocks: M9/M10
    status: 已验证（结论：策略有稳定超额但门控增益微小，暂不门控）

